name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rivalwatch_test
          POSTGRES_USER: rivalwatch
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql,redis
          coverage: none
        env:
          update: true

      - name: Verify actual PHP security version
        run: |
          php -r 'if (PHP_VERSION_ID < 80427 || PHP_VERSION_ID >= 80500) { fwrite(STDERR, "PHP 8.4.27+ required; got ".PHP_VERSION."\n"); exit(1); }'

      - name: Copy .env
        run: cp .env.example .env.testing

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate --env=testing

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Run migrations
        env:
          DB_DATABASE: rivalwatch_test
          DB_USERNAME: rivalwatch
          DB_PASSWORD: testpass
          DB_HOST: localhost
        run: php artisan migrate:fresh --env=testing

      - name: Run tests
        env:
          DB_DATABASE: rivalwatch_test
          DB_USERNAME: rivalwatch
          DB_PASSWORD: testpass
          DB_HOST: localhost
        run: php artisan test

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: app

  deploy-swarm:
    name: Deploy to Docker Swarm
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
            DEPLOY_TOKEN="${DEPLOY_TOKEN}" IMAGE="${IMAGE}" GH_ACTOR="${GH_ACTOR}" \
            bash -s << 'EOF'
          set -euo pipefail

          if [[ ! "$IMAGE" =~ ^ghcr\.io/[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "Release requires a published immutable GHCR application digest" >&2
            exit 1
          fi

          echo "${DEPLOY_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

          docker pull "${IMAGE}"

          # Verify the complete exact role set before the first service mutation.
          roles=(rivalwatch_app rivalwatch_horizon rivalwatch_scheduler)
          services="$(sudo docker service ls --format '{{.Name}}')"
          for role in "${roles[@]}"; do
            if ! grep -Fxq "$role" <<< "$services"; then
              echo "Missing required Swarm service: $role" >&2
              exit 1
            fi
          done

          for role in "${roles[@]}"; do
            sudo docker service update --force --with-registry-auth --image "$IMAGE" "$role"
          done

          # The manager can inspect its own running containers. A task on another
          # node cannot be read back through this path, so hold rather than infer.
          image_id="$(sudo docker image inspect --format '{{.Id}}' "$IMAGE")"
          local_node="$(sudo docker info --format '{{.Swarm.NodeID}}')"
          if [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ || -z "$local_node" ]]; then
            echo "Cannot establish local immutable image/node identity" >&2
            exit 1
          fi

          # Swarm updates may return before the task inventory is fully settled.
          for attempt in {1..10}; do
            converged=1
            for role in "${roles[@]}"; do
              spec_image="$(sudo docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$role")"
              replicas="$(sudo docker service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' "$role")"
              if [[ "$spec_image" != "$IMAGE" || ! "$replicas" =~ ^[1-9][0-9]*$ ]]; then
                converged=0
                continue
              fi

              # Do not filter by desired state: an old but still-live task also
              # blocks convergence, even if Swarm wants to shut it down.
              task_ids="$(sudo docker service ps --no-trunc --format '{{.ID}}' "$role")"
              running=0
              if [[ -z "$task_ids" ]]; then
                converged=0
                continue
              fi
              while IFS= read -r task_id; do
                if [[ -z "$task_id" ]]; then
                  converged=0
                  continue
                fi
                task="$(sudo docker inspect --type task --format '{{.DesiredState}}|{{.Status.State}}|{{.Spec.ContainerSpec.Image}}|{{.NodeID}}|{{if .Status.ContainerStatus}}{{.Status.ContainerStatus.ContainerID}}{{end}}' "$task_id")"
                IFS='|' read -r desired state task_image node container_id <<< "$task"
                if [[ "$desired" == shutdown && "$state" =~ ^(shutdown|complete|failed|rejected|orphaned|remove)$ ]]; then
                  continue  # historical, stopped task
                fi
                if [[ "$desired" != running || "$state" != running || "$task_image" != "$IMAGE" || -z "$container_id" ]]; then
                  converged=0
                  continue
                fi
                if [[ "$node" != "$local_node" ]]; then
                  echo "Cannot inspect remote running container for $role ($task_id)" >&2
                  exit 1
                fi
                observed="$(sudo docker inspect --type container --format '{{.State.Running}}|{{.Image}}|{{.Config.Image}}' "$container_id")"
                if [[ "$observed" != "true|$image_id|$IMAGE" ]]; then
                  converged=0
                  continue
                fi
                running=$((running + 1))
              done <<< "$task_ids"
              if [[ "$running" -ne "$replicas" ]]; then
                converged=0
              fi
            done
            if [[ "$converged" -eq 1 ]]; then
              echo "Verified desired and running container image for all required RivalWatch roles."
              exit 0
            fi
            if [[ "$attempt" -lt 10 ]]; then sleep 3; fi
          done
          echo "RivalWatch roles did not converge on the published running image" >&2
          exit 1
          EOF
